<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Trading</title>
    <!-- Bootstrap CSS & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: none;
            margin-bottom: 20px;
        }
        .card-header {
            background-color: #fff;
            border-bottom: 1px solid #edf2f7;
            font-weight: 600;
        }
        .auth-card {
            max-width: 420px;
            margin: 60px auto;
        }
        .badge-win { background-color: #198754; }
        .badge-loss { background-color: #dc3545; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fa-solid fa-chart-line text-success me-2"></i>Jurnal Trading</a>
            <div class="d-flex align-items-center">
                <span id="userStatus" class="navbar-text me-3 text-light d-none">
                    <i class="fa-solid fa-circle-user me-1"></i> <span id="userEmail"></span>
                </span>
                <button id="btnLogout" class="btn btn-outline-light btn-sm d-none" onclick="logoutUser()">
                    <i class="fa-solid fa-right-from-bracket me-1"></i>Keluar
                </button>
            </div>
        </div>
    </nav>

    <!-- SECTION 1: AUTHENTICATION (Login & Sign Up) -->
    <div id="authSection" class="container">
        <div class="card auth-card">
            <div class="card-header text-center py-3">
                <h5 class="mb-0" id="authTitle">Masuk ke Jurnal Trading</h5>
            </div>
            <div class="card-body p-4">
                <div id="authAlert" class="alert alert-danger d-none" role="alert"></div>

                <!-- Form Auth -->
                <form id="authForm" onsubmit="handleAuth(event)">
                    <div class="mb-3">
                        <label for="email" class="form-label">Alamat Email</label>
                        <input type="email" class="form-control" id="email" required placeholder="nama@email.com">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Kata Sandi</label>
                        <input type="password" class="form-control" id="password" required placeholder="******">
                    </div>
                    <button type="submit" id="btnSubmitAuth" class="btn btn-primary w-100 mb-3">
                        <i class="fa-solid fa-right-to-bracket me-1"></i>Masuk
                    </button>
                </form>

                <div class="text-center">
                    <small id="authToggleText">Belum punya akun? <a href="#" onclick="toggleAuthMode(true)">Daftar sekarang</a></small>
                </div>
            </div>
        </div>
    </div>

    <!-- SECTION 2: DASHBOARD TRADING (Tampilan Utama setelah Login) -->
    <div id="dashboardSection" class="container mt-4 d-none">
        
        <!-- Summary Cards -->
        <div class="row">
            <div class="col-md-3">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <h6 class="card-title">Total Trade</h6>
                        <h2 id="statTotal" class="mb-0">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-success">
                    <div class="card-body">
                        <h6 class="card-title">Win Rate</h6>
                        <h2 id="statWinRate" class="mb-0">0%</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-info">
                    <div class="card-body">
                        <h6 class="card-title">Total Profit/Loss</h6>
                        <h2 id="statPnL" class="mb-0">$0.00</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-secondary">
                    <div class="card-body">
                        <h6 class="card-title">Profit Factor</h6>
                        <h2 id="statPF" class="mb-0">0.00</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Form Input Trade -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <i class="fa-solid fa-plus me-1"></i>Tambah Transaksi
                    </div>
                    <div class="card-body">
                        <form id="tradeForm" onsubmit="saveTrade(event)">
                            <div class="mb-3">
                                <label class="form-label">Pasangan / Aset</label>
                                <input type="text" id="pair" class="form-control" placeholder="Contoh: EURUSD, XAUUSD" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Tipe</label>
                                <select id="type" class="form-select" required>
                                    <option value="BUY">BUY</option>
                                    <option value="SELL">SELL</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Hasil (P/L $)</label>
                                <input type="number" step="0.01" id="pnl" class="form-control" placeholder="Contoh: 50 atau -25" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Catatan / Alasan</label>
                                <textarea id="notes" class="form-control" rows="2" placeholder="Catatan analisis..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Simpan Trade</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabel & Grafik -->
            <div class="col-md-8">
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fa-solid fa-chart-line me-1"></i>Grafik Performa Portfolio
                    </div>
                    <div class="card-body">
                        <canvas id="performanceChart" height="100"></canvas>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <i class="fa-solid fa-list me-1"></i>Riwayat Transaksi
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0 align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Tanggal</th>
                                        <th>Aset</th>
                                        <th>Tipe</th>
                                        <th>P/L ($)</th>
                                        <th>Catatan</th>
                                        <th>Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="tradeTableBody">
                                    <tr>
                                        <td colspan="6" class="text-center py-3 text-muted">Belum ada data transaksi.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- SDK Firebase (Modular v9/v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            collection, 
            addDoc, 
            onSnapshot, 
            deleteDoc, 
            query, 
            orderBy, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // CONFIG FIREBASE (Ganti dengan Config milikmu)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAeWvYIS_-SRSc-AINGNa7hTDOGmraxU7o",
            authDomain: "trading-journal-ecfcd.firebaseapp.com",
            projectId: "trading-journal-ecfcd",
            storageBucket: "trading-journal-ecfcd.firebasestorage.app",
            messagingSenderId: "282320283613",
            appId: "1:282320283613:web:058ed10592705d6d453834"
			measurementId: "G-Q2GV8YF6ME"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isSignUpMode = false;
        let currentUser = null;
        let chartInstance = null;
        let unsubscribeTrades = null;

        // Toggle antara Login dan Sign Up
        window.toggleAuthMode = function(signUp) {
            isSignUpMode = signUp;
            const title = document.getElementById('authTitle');
            const submitBtn = document.getElementById('btnSubmitAuth');
            const toggleText = document.getElementById('authToggleText');
            const alertBox = document.getElementById('authAlert');

            alertBox.classList.add('d-none');

            if (isSignUpMode) {
                title.innerText = "Daftar Akun Baru";
                submitBtn.innerText = "Daftar";
                toggleText.innerHTML = 'Sudah punya akun? <a href="#" onclick="toggleAuthMode(false)">Masuk di sini</a>';
            } else {
                title.innerText = "Masuk ke Jurnal Trading";
                submitBtn.innerText = "Masuk";
                toggleText.innerHTML = 'Belum punya akun? <a href="#" onclick="toggleAuthMode(true)">Daftar sekarang</a>';
            }
        };

        // Handle Login / Register
        window.handleAuth = async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('authAlert');

            alertBox.classList.add('d-none');

            try {
                if (isSignUpMode) {
                    // Sign Up
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    // Buat dokumen profil pengguna di Firestore
                    await setDoc(doc(db, "users", user.uid), {
                        email: user.email,
                        createdAt: serverTimestamp()
                    });
                } else {
                    // Login
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                alertBox.innerText = error.message;
                alertBox.classList.remove('d-none');
            }
        };

        // Logout
        window.logoutUser = function() {
            signOut(auth);
        };

        // Observer Status Otentikasi
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            const authSec = document.getElementById('authSection');
            const dashSec = document.getElementById('dashboardSection');
            const userStatus = document.getElementById('userStatus');
            const btnLogout = document.getElementById('btnLogout');
            const userEmail = document.getElementById('userEmail');

            if (user) {
                // User sedang Login
                authSec.classList.add('d-none');
                dashSec.classList.remove('d-none');
                userStatus.classList.remove('d-none');
                btnLogout.classList.remove('d-none');
                userEmail.innerText = user.email;

                // Load Data Trades dari Firestore secara Realtime
                loadTrades(user.uid);
            } else {
                // User Logout
                if (unsubscribeTrades) unsubscribeTrades();
                authSec.classList.remove('d-none');
                dashSec.classList.add('d-none');
                userStatus.classList.add('d-none');
                btnLogout.classList.add('d-none');
                
                // Reset UI
                resetDashboard();
            }
        });

        // Simpan Data Trade Baru ke Firestore
        window.saveTrade = async function(e) {
            e.preventDefault();
            if (!currentUser) return;

            const pair = document.getElementById('pair').value.toUpperCase();
            const type = document.getElementById('type').value;
            const pnl = parseFloat(document.getElementById('pnl').value);
            const notes = document.getElementById('notes').value;

            try {
                await addDoc(collection(db, "users", currentUser.uid, "trades"), {
                    pair: pair,
                    type: type,
                    pnl: pnl,
                    notes: notes,
                    timestamp: serverTimestamp()
                });

                document.getElementById('tradeForm').reset();
            } catch (err) {
                alert("Gagal menyimpan data: " + err.message);
            }
        };

        // Hapus Trade
        window.deleteTrade = async function(tradeId) {
            if (!currentUser || !confirm("Yakin ingin menghapus transaksi ini?")) return;
            try {
                await deleteDoc(doc(db, "users", currentUser.uid, "trades", tradeId));
            } catch (err) {
                alert("Gagal menghapus: " + err.message);
            }
        };

        // Mendengarkan Perubahan Data Firestore (Realtime)
        function loadTrades(userId) {
            const q = query(
                collection(db, "users", userId, "trades"), 
                orderBy("timestamp", "asc")
            );

            unsubscribeTrades = onSnapshot(q, (snapshot) => {
                const trades = [];
                snapshot.forEach((doc) => {
                    trades.push({ id: doc.id, ...doc.data() });
                });

                renderDashboard(trades);
            });
        }

        // Render Tabel, Statistik & Grafik
        function renderDashboard(trades) {
            const tbody = document.getElementById('tradeTableBody');
            tbody.innerHTML = '';

            let totalTrades = trades.length;
            let wins = 0;
            let totalPnL = 0;
            let totalWinAmount = 0;
            let totalLossAmount = 0;

            const chartLabels = [];
            const chartData = [];
            let cumulativePnL = 0;

            if (trades.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-3 text-muted">Belum ada data transaksi.</td></tr>';
            } else {
                trades.forEach((trade) => {
                    const pnl = trade.pnl || 0;
                    totalPnL += pnl;
                    cumulativePnL += pnl;

                    if (pnl > 0) {
                        wins++;
                        totalWinAmount += pnl;
                    } else {
                        totalLossAmount += Math.abs(pnl);
                    }

                    const dateStr = trade.timestamp ? new Date(trade.timestamp.toDate()).toLocaleDateString('id-ID') : '-';
                    chartLabels.push(dateStr);
                    chartData.push(cumulativePnL);

                    const pnlClass = pnl >= 0 ? 'text-success fw-bold' : 'text-danger fw-bold';
                    const typeBadge = trade.type === 'BUY' ? 'bg-primary' : 'bg-warning text-dark';

                    tbody.innerHTML += `
                        <tr>
                            <td>${dateStr}</td>
                            <td><strong>${trade.pair}</strong></td>
                            <td><span class="badge ${typeBadge}">${trade.type}</span></td>
                            <td class="${pnlClass}">${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}</td>
                            <td><small>${trade.notes || '-'}</small></td>
                            <td>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteTrade('${trade.id}')">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            }

            // Hitung Statistik
            const winRate = totalTrades > 0 ? ((wins / totalTrades) * 100).toFixed(1) : 0;
            const profitFactor = totalLossAmount > 0 ? (totalWinAmount / totalLossAmount).toFixed(2) : (totalWinAmount > 0 ? "∞" : "0.00");

            document.getElementById('statTotal').innerText = totalTrades;
            document.getElementById('statWinRate').innerText = `${winRate}%`;
            document.getElementById('statPnL').innerText = `$${totalPnL.toFixed(2)}`;
            document.getElementById('statPF').innerText = profitFactor;

            // Render Grafik
            updateChart(chartLabels, chartData);
        }

        // Render / Update Chart.js
        function updateChart(labels, data) {
            const ctx = document.getElementById('performanceChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Kumulatif P/L ($)',
                        data: data,
                        borderColor: '#0d6efd',
                        backgroundColor: 'rgba(13, 110, 253, 0.1)',
                        fill: true,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: false }
                    }
                }
            });
        }

        function resetDashboard() {
            document.getElementById('tradeTableBody').innerHTML = '<tr><td colspan="6" class="text-center py-3 text-muted">Belum ada data transaksi.</td></tr>';
            document.getElementById('statTotal').innerText = "0";
            document.getElementById('statWinRate').innerText = "0%";
            document.getElementById('statPnL').innerText = "$0.00";
            document.getElementById('statPF').innerText = "0.00";
            if (chartInstance) chartInstance.destroy();
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
